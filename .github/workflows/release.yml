name: Release

# Releases are never automatic. Either run this workflow by hand from the
# Actions tab, or push a v* tag.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, with the leading v (for example v0.2.0)"
        required: true
        type: string
      prerelease:
        description: "Mark as a pre-release"
        required: false
        default: false
        type: boolean
      draft:
        description: "Create the release as a draft, to review before publishing"
        required: false
        default: false
        type: boolean
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  GO_VERSION: "1.22"

jobs:
  verify:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l . | grep -v '^tmp-' || true)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'ed:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: |
          go vet ./...
          go vet -tags integration ./lib/
          go vet -tags e2e ./test/e2e/
          for db in sqlite pg mysql mssql; do
            go vet -tags "goflymin,db_$db" ./...
          done

      - name: Test
        run: go test ./... -count=1

  compatibility:
    name: Flyway compatibility (${{ matrix.database }})
    runs-on: ubuntu-latest
    # nothing ships without the compatibility suite passing on every database
    strategy:
      fail-fast: true
      matrix:
        database: [sqlite, postgres, mysql, mssql]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Pull the Flyway image
        run: docker pull flyway/flyway:10

      - name: Start the database
        if: matrix.database != 'sqlite'
        run: make db-up-${{ matrix.database }}

      - name: Compare against Flyway
        run: make test-e2e-${{ matrix.database }}

      - name: Stop the database
        if: always() && matrix.database != 'sqlite'
        run: make db-down || true

  release:
    name: Build and publish
    runs-on: ubuntu-latest
    needs: [verify, compatibility]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Work out the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      - name: Check the version matches main.go
        run: |
          declared="v$(grep -oP 'const Version = "\K[^"]+' main.go)"
          asked="${{ steps.version.outputs.version }}"
          if [ "$declared" != "$asked" ]; then
            echo "main.go declares $declared but the release asks for $asked."
            echo "Update 'const Version' in main.go and commit before releasing."
            exit 1
          fi

      - name: Install upx
        run: |
          sudo apt-get update
          sudo apt-get install -y upx-ucl
          upx --version | head -1

      - name: Cross compile and pack
        run: make release-all

      - name: Checksums
        run: |
          cd build
          sha256sum gofly-* gofly.*-* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: gofly ${{ steps.version.outputs.version }}
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            build/gofly-*
            build/gofly.*-*
            build/SHA256SUMS
          body: |
            Single static binaries, no JVM and no runtime to install.

            | Platform | File |
            |---|---|
            | Linux x86-64 | `gofly-linux-amd64` |
            | Linux ARM64 | `gofly-linux-arm64` |
            | macOS Intel | `gofly-darwin-amd64` |
            | macOS Apple Silicon | `gofly-darwin-arm64` |
            | Windows x86-64 | `gofly-windows-amd64.exe` |
            | Windows ARM64 | `gofly-windows-arm64.exe` |

            ### Single database builds

            Linux only, and about half the size, for when you know which
            database you are migrating. Same tool, same flags, just without the
            other three drivers compiled in. `gofly version` lists what a build
            supports.

            | Database | x86-64 | ARM64 |
            |---|---|---|
            | PostgreSQL | `gofly.pg-linux-amd64` | `gofly.pg-linux-arm64` |
            | MySQL / MariaDB | `gofly.mysql-linux-amd64` | `gofly.mysql-linux-arm64` |
            | SQL Server | `gofly.mssql-linux-amd64` | `gofly.mssql-linux-arm64` |
            | SQLite | `gofly.sqlite-linux-amd64` | `gofly.sqlite-linux-arm64` |

            Verify a download with `sha256sum -c SHA256SUMS`.

            Every binary is built without debug symbols. The Linux builds and
            the Windows x86-64 one are additionally packed with UPX, which is
            why they are roughly a third of the size. macOS and Windows ARM64
            are stripped but not packed: UPX cannot pack them, and on macOS
            packing would break codesigning and Gatekeeper.

            Built and released only after the Flyway compatibility suite passed
            against PostgreSQL, MySQL, SQL Server and SQLite.
